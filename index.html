<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Pop – Cute QR Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fff0f7;--card:#fff;--ink:#3b2f55;--muted:#8b7ca6;--line:#f3d9ea;--p1:#ff7eb6;--p2:#8b7cf6;--soft:#fdf3fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1730;--card:#2a2142;--ink:#f4eaff;--muted:#b6a6d6;--line:#3d3260;--soft:#241c3a}}
:root[data-theme="dark"]{--bg:#1d1730;--card:#2a2142;--ink:#f4eaff;--muted:#b6a6d6;--line:#3d3260;--soft:#241c3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Quicksand','Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 10% 0,#ff7eb655,transparent 40%),radial-gradient(circle at 95% 15%,#8b7cf655,transparent 40%),radial-gradient(circle at 50% 100%,#7be0d155,transparent 45%);background-attachment:fixed;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
header{text-align:center;position:relative;padding:8px 0 16px}
h1{margin:0;font-size:2.1rem;background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--muted);font-weight:600}
#theme{position:absolute;right:0;top:8px;border:0;background:var(--card);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;box-shadow:0 4px 14px #8b7cf633}
.grid{display:grid;gap:14px;grid-template-areas:"inp" "prev" "sty"}
@media(min-width:900px){.grid{grid-template-columns:1.25fr 1fr;grid-template-areas:"inp prev" "sty prev";align-items:start}.prev{position:sticky;top:14px}}
.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:0 10px 30px #8b7cf626;border:2px solid var(--line)}
.inp{grid-area:inp}.prev{grid-area:prev}.sty{grid-area:sty}
h2{margin:0 0 12px;font-size:1.1rem}
.tabs,.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.pill{border:2px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;font-size:.9rem}
.tab.on,.pill.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px;color:var(--muted)}
input[type=text],textarea{width:100%;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;font-weight:600;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--p2)}
textarea{min-height:90px;resize:vertical}
.go{width:100%;margin-top:14px;border:0;border-radius:18px;padding:14px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;background:linear-gradient(90deg,var(--p1),var(--p2));cursor:pointer;box-shadow:0 8px 20px #ff7eb655;transition:transform .15s}
.go:active{transform:scale(.97)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qrbox{display:grid;place-items:center;min-height:290px;border-radius:22px;background:var(--soft);border:2px dashed var(--line);padding:10px;text-align:center;color:var(--muted);font-weight:700}
.qrbox canvas{max-width:100%;height:auto!important;border-radius:14px}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.dl button{border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:10px 4px;font:inherit;font-weight:700;cursor:pointer}
.dl button.pdf{grid-column:span 3;background:linear-gradient(90deg,#7be0d1,#8b7cf6);color:#fff;border:0}
.dl button:active{transform:scale(.96)}
.cur{font-weight:700;color:var(--muted);font-size:.85rem;margin:2px 0 10px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:270px;overflow:auto;padding:4px}
.chip{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;padding:0}
.chip i{width:58%;height:58%;display:block}
.chip.on{border-color:var(--p2);box-shadow:0 0 0 3px #8b7cf655}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cols div{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.cols input{width:100%;height:40px;border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:2px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px}.row .pill{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--muted);font-weight:600;margin-top:20px;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<header><button id="theme" aria-label="Toggle theme">🌙</button><h1>QR Pop 💖</h1><p>200 cute QR styles. Pick one, pop it, download it.</p></header>
<div class="grid">
<section class="card inp"><h2>1 · What goes inside? ✏️</h2><div class="tabs" id="tabs"></div><div id="fields"></div><button class="go" id="gen">✨ Generate QR</button></section>
<section class="card prev"><h2>Your QR 🎀</h2><div class="qrbox" id="qr">Your QR will pop up here ✨</div>
<div class="dl"><button data-x="png">PNG</button><button data-x="jpg">JPG</button><button data-x="webp">WEBP</button><button data-x="svg">SVG</button><button data-x="pdf" class="pdf" style="grid-column:span 2">📄 PDF</button></div></section>
<section class="card sty"><h2>2 · Pick your style 🎨</h2><div class="pills" id="pills"></div><div class="cur" id="cur"></div><div class="gal" id="gal"></div>
<div class="cols"><div>Dots<input type="color" id="ca"></div><div>Accent<input type="color" id="cb"></div><div>Background<input type="color" id="cbg"></div></div>
<div class="row"><button class="pill" id="rnd">🎲 Surprise me</button></div></section>
</div>
<footer>Tip: keep strong contrast between dots and background so every phone can scan it 📱</footer>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const P="Ink|#2d2a4a|#2d2a4a|#ffffff;Berry|#c2185b|#c2185b|#fff5f9;Mint|#1a9e7a|#1a9e7a|#f0fff9;Ocean|#1565c0|#1565c0|#f0f7ff;Grape|#7b2cbf|#7b2cbf|#faf5ff;Sunny|#c77700|#c77700|#fffbe8;Cherry|#e53950|#e53950|#fff3f4;Forest|#2e7d32|#2e7d32|#f4fff4;Cocoa|#6d4c41|#6d4c41|#fff8f3;Slate|#455a64|#455a64|#f4f8fa;Bubblegum|#ff4fa3|#6c63ff|#fff0fa;Sunset|#ff512f|#dd2476|#fff6f2;Aurora|#00a58e|#3a47d5|#f2fffd;Candy|#f857a6|#8a2be2|#fff2fb;Lagoon|#0093e9|#6a11cb|#f0faff;Peach|#d9455f|#f07f2b|#fff7f1;Lavender|#6a5acd|#b44fd1|#f8f5ff;Matcha|#0b7a5e|#5a9e1f|#f6fff0;Sky|#2193b0|#2b4f9e|#f0fbff;Cotton|#ff4fa3|#5b8def|#fdf2ff;Lemonade|#d49a00|#e8590c|#fffdf0;Rose|#be185d|#e11d48|#fff1f5;Midnight|#1b2a4a|#3b6ea5|#f0f5f8;Neon|#0072ff|#7a00ff|#f3f8ff;Strawberry|#e91e63|#ff5722|#fff4f2;Galaxy|#4b2a7a|#a3318f|#f9f3ff;Tropical|#0a9396|#e9731c|#f1fffd;Coral|#ff5a5f|#c2185b|#fff5f4;Jade|#00796b|#1565c0|#f0fffb;Plum|#8e2de2|#4a00e0|#f7f2ff;Blossom|#d6336c|#9c36b5|#fff3f9;Honey|#d9770f|#8d5a00|#fffaf0;Icy|#0288d1|#4527a0|#f2f9ff;Moss|#386641|#6a994e|#f6fbf0;Ember|#b71c1c|#f57c00|#fff5f0;Cosmic|#3f51b5|#e91e63|#f6f4ff;Dreamy|#7e57c2|#26a69a|#f8f6ff;Sorbet|#ef476f|#118ab2|#fff4f7;Rainy|#37474f|#0288d1|#f3f9fb;PeachyMint|#ff5c8a|#00a896|#fff4f8".split(';').map(s=>{const[n,a,b,bg]=s.split('|');return{n,a,b,bg}});
const S=[['Classic','square','square','square'],['Soft','rounded','extra-rounded','dot'],['Bubble','dots','dot','dot'],['Fancy','classy','extra-rounded','square'],['Cute','extra-rounded','extra-rounded','dot']];
const R=['3px','9px','50%','60% 0 60% 0','14px'];
const styles=[];S.forEach((s,si)=>P.forEach(p=>styles.push({id:styles.length+1,name:p.n+' '+s[0],si,p})));
const T={link:{l:'🔗 Link',f:[['url','Website link','https://example.com']]},text:{l:'💬 Text',f:[['t','Your text','Write anything…','area']]},wifi:{l:'📶 Wi-Fi',f:[['ssid','Network name',''],['pw','Password','']]},mail:{l:'✉️ Email',f:[['to','Email address','hello@example.com'],['sub','Subject (optional)','']]}};
let tab='link',v={},sel=null,gen=false,filt=-1,qr=null,c={},shape=S[1];
function data(){const g=k=>(v[k]||'').trim();
 if(tab==='link'){let u=g('url');if(u&&!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return u}
 if(tab==='text')return v.t||'';
 if(tab==='wifi'){const e=s=>s.replace(/([\\;,:"])/g,'\\$1');return g('ssid')?`WIFI:T:${g('pw')?'WPA':'nopass'};S:${e(g('ssid'))};P:${e(g('pw'))};;`:''}
 return g('to')?`mailto:${g('to')}${g('sub')?'?subject='+encodeURIComponent(g('sub')):''}`:''}
function opts(size,type='canvas'){const o={width:size,height:size,type,data:data()||' ',margin:14,qrOptions:{errorCorrectionLevel:'Q'},
 dotsOptions:{type:shape[1],color:c.a},cornersSquareOptions:{type:shape[2],color:c.a},cornersDotOptions:{type:shape[3],color:c.b},backgroundOptions:{color:c.bg}};
 if(c.a!==c.b)o.dotsOptions.gradient={type:'linear',rotation:Math.PI/4,colorStops:[{offset:0,color:c.a},{offset:1,color:c.b}]};
 return o}
function draw(){if(!gen||!data())return;const o=opts(260);if(!qr){qr=new QRCodeStyling(o);$('#qr').innerHTML='';qr.append($('#qr'))}else qr.update(o)}
function tabs(){$('#tabs').innerHTML=Object.keys(T).map(k=>`<button class="tab${k===tab?' on':''}" data-k="${k}">${T[k].l}</button>`).join('');
 $('#fields').innerHTML=T[tab].f.map(([k,l,p,a])=>`<label>${l}</label>${a?`<textarea data-k="${k}" placeholder="${p}">${v[k]||''}</textarea>`:`<input type="text" data-k="${k}" placeholder="${p}" value="${v[k]||''}">`}`).join('')}
function gal(){$('#gal').innerHTML=styles.filter(s=>filt<0||s.si===filt).map(s=>`<button class="chip${sel&&sel.id===s.id?' on':''}" data-id="${s.id}" title="#${s.id} ${s.name}" style="background:${s.p.bg}"><i style="background:linear-gradient(135deg,${s.p.a},${s.p.b});border-radius:${R[s.si]}"></i></button>`).join('')}
function pills(){$('#pills').innerHTML=[['All 200',-1],...S.map((s,i)=>[s[0],i])].map(([n,i])=>`<button class="pill${filt===i?' on':''}" data-f="${i}">${n}</button>`).join('')}
function pick(id){sel=styles[id-1];shape=S[sel.si];c={a:sel.p.a,b:sel.p.b,bg:sel.p.bg};$('#ca').value=c.a;$('#cb').value=c.b;$('#cbg').value=c.bg;$('#cur').textContent=`Style #${sel.id} · ${sel.name}`;gal();draw()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;tabs();draw()}};
$('#fields').oninput=e=>{v[e.target.dataset.k]=e.target.value;draw()};
$('#pills').onclick=e=>{if(e.target.dataset.f!==undefined){filt=+e.target.dataset.f;pills();gal()}};
$('#gal').onclick=e=>{const b=e.target.closest('.chip');if(b)pick(+b.dataset.id)};
['ca','cb','cbg'].forEach((id,i)=>$('#'+id).oninput=e=>{c[['a','b','bg'][i]]=e.target.value;draw()});
$('#rnd').onclick=()=>pick(1+Math.floor(Math.random()*200));
$('#gen').onclick=()=>{if(!data()){const b=$('#fields');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('Add something first 🥺');return}
 gen=true;qr=null;draw();const q=$('#qr');q.classList.remove('pop');void q.offsetWidth;q.classList.add('pop');toast('Your QR is ready 🎉')};
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';$('#theme').textContent=dark?'🌙':'☀️'};
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function dl(x){if(!gen||!data()){toast('Generate a QR first 💫');return}
 try{const q=new QRCodeStyling(opts(1024,x==='svg'?'svg':'canvas'));await new Promise(r=>setTimeout(r,250));const name='qr-pop-'+(sel?sel.id:'x');
 if(x==='pdf'){const b=await q.getRawData('png');const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});d.setFontSize(22);d.setTextColor(139,124,246);d.text('My QR Code',105,28,{align:'center'});d.addImage(url,'PNG',35,45,140,140);
  d.setFontSize(11);d.setTextColor(120);d.text(d.splitTextToSize(data(),150).slice(0,4),105,198,{align:'center'});d.text('Made with QR Pop',105,285,{align:'center'});d.save(name+'.pdf')}
 else save(await q.getRawData(x==='jpg'?'jpeg':x),`${name}.${x}`);
 toast('Downloaded 💾')}catch(err){toast('Oops, try again 🥲')}}
document.querySelector('.dl').onclick=e=>{const x=e.target.dataset.x;if(x)dl(x)};
tabs();pills();pick(51);
</script>
</body>
</html>
